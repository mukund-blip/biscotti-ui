name: Static export check

# Pull-request gate for the static export. It builds under a sub-path
# (/biscotti-ui by default), so base-path prefixing, canonicals and registry URLs are
# exercised, then validates and tests that export. Production is deployed from
# main by netlify.yml (root path); that workflow doesn't run on pull requests,
# so this is the only PR validation of the export. The former GitHub Pages
# deploy job was removed: Pages isn't available for this private repo.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public origin and optional base path to build for
        type: string
        default: https://mukund-blip.github.io/biscotti-ui

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
        env:
          PAGES_SITE_URL: ${{ inputs.site_url || 'https://mukund-blip.github.io/biscotti-ui' }}
      - run: node scripts/check-pages.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-e2e-results
          path: test-results
          retention-days: 7
